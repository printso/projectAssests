[package]
name = "spolia-server"
description = "Spolia 服务进程：HTTP API + 静态资源托管 + MCP 端点。Tauri 与浏览器共用同一后端。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "spolia-server"
path = "src/main.rs"

[dependencies]
spolia-domain = { workspace = true }
spolia-storage = { workspace = true }
spolia-service = { workspace = true }
spolia-scanner = { workspace = true }
spolia-asset = { workspace = true }
spolia-insight = { workspace = true }
spolia-search = { workspace = true }
spolia-jobs = { workspace = true }
spolia-ai = { workspace = true }
spolia-mcp = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `ServiceExt::oneshot`：直接驱动 Router 做集成测试，无需真起 TCP 监听
tower = { workspace = true }
