[package]
name = "projectassests-jobs"
description = "projectAssests 任务引擎：可取消任务队列、进度广播、任务持久化。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
projectassests-domain = { workspace = true }
projectassests-storage = { workspace = true }
# pipeline 模块把三个引擎串成任务链：扫描 → 抽取 → 洞察。
# 依赖方向是单向的（jobs 在最上层），不构成循环。
projectassests-scanner = { workspace = true }
projectassests-asset = { workspace = true }
projectassests-insight = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "projectassests_jobs"
path = "src/lib.rs"
