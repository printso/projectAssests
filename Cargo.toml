[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/storage",
    "crates/scanner",
    "crates/asset",
    "crates/insight",
    "crates/search",
    "crates/jobs",
    "crates/ai",
    "crates/service",
    "crates/mcp",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/projectassests/projectassests"
authors = ["projectAssests Contributors"]

# ── 依赖版本单一来源 ──────────────────────────────────────────────────────
# 所有 crate 通过 workspace = true 引用，避免版本漂移。
[workspace.dependencies]
# 内部 crate
projectassests-domain   = { path = "crates/domain" }
projectassests-storage  = { path = "crates/storage" }
projectassests-scanner  = { path = "crates/scanner" }
projectassests-asset    = { path = "crates/asset" }
projectassests-insight  = { path = "crates/insight" }
projectassests-search   = { path = "crates/search" }
projectassests-jobs     = { path = "crates/jobs" }
projectassests-ai       = { path = "crates/ai" }
projectassests-mcp      = { path = "crates/mcp" }
projectassests-service  = { path = "crates/service" }

# 序列化 / 错误
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"

# 存储
rusqlite = { version = "0.38", features = ["bundled", "functions"] }

# 异步 / 网络
tokio      = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
# SSE 进度推送：`ReceiverStream` + `StreamExt::map`。
# 引擎侧的 `ProgressSubscription` 基于 watch，适配到 axum 的 `Sse` 需要
# 一个 `Stream` 实现；用 mpsc + ReceiverStream 比手写 `poll_next` 简单得多，
# 且不引入 async-stream 这类 proc-macro 依赖。
tokio-stream = { version = "0.1", features = ["sync"] }
axum       = { version = "0.8", features = ["json", "query"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 任务处理器需要 `Arc<dyn JobHandler>`（让贡献者注册新任务类型而不改引擎）。
# 原生 AFIT 的 `impl Future` 返回类型**不是 dyn-compatible**，
# 故用 async-trait 宏做装箱——这是 Rust 异步 trait object 的标准解法。
async-trait = "0.1"

# 文件系统遍历（.gitignore 感知）
ignore   = "0.4"
walkdir  = "2"
globset  = "0.4"

# 并行：项目静态分析是"多项目 × 多文件"的纯 IO/CPU 混合负载，
# 单线程扫 200 项目要 3 分钟以上，超出《产品设计书》的性能预算
rayon = "1"

# 日志 / 工具
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono             = { version = "0.4", features = ["serde"] }
uuid               = { version = "1", features = ["v4"] }
anyhow             = "1"
urlencoding        = "2"
once_cell          = "1"

# 测试
tempfile = "3"
# 路由集成测试用 `ServiceExt::oneshot` 直接驱动 Router，
# 不必真起 TCP 监听（更快、无端口冲突、可并行）。
# 版本须与 axum 0.8 的传递依赖一致，否则会编译出两份 tower 类型。
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
